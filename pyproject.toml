[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quivers"
version = "0.25.1"
description = "A typed functional probabilistic programming language with a PyTorch runtime and eleven transpilation targets."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.14"
authors = [{name = "Aaron Steven White"}]
keywords = [
    "category-theory",
    "enriched-categories",
    "pytorch",
    "tensor",
    "probabilistic-programming",
    "algebra",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "torch>=2.0",
    "didactic>=0.17.1",
    "panproto>=0.74.4",
    "panproto-grammars-all>=0.74.4",
    "pygments>=2.10",
    "tree-sitter>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "pytest-xdist>=3.6",
    "pytest-timeout",
    "pytest-split>=0.9",
    "ruff>=0.15,<0.16",
    "pyright",
    "numpy",
    "pandas",
    "polars",
    "pyarrow",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9,<10",
    "mkdocstrings[python]",
    "pymdown-extensions",
    "pygments",
]
data = [
    "narwhals>=2.21",
    "scikit-learn>=1.6",
]
diagnostics = [
    "arviz>=1.0",
    "xarray>=2025.1",
    "netcdf4>=1.7",
]
formulas = [
    "narwhals>=2.21",
    "scikit-learn>=1.6",
    "arviz>=1.0",
    "xarray>=2025.1",
    "netcdf4>=1.7",
    "formulae>=0.6",
]
repl = [
    "textual>=0.83",
    "prompt_toolkit>=3.0",
    "rich>=13.7",
    "ipykernel>=6.29",
    "jupyter_client>=8.6",
]
lsp = [
    "pygls>=2.0",
    "lsprotocol>=2024.0.0",
]
targets = [
    "pyro-ppl>=1.9",
    "pymc>=5.20",
    "scipy>=1.14",
]

[project.urls]
Homepage = "https://quivers.dev"
Repository = "https://github.com/quivers-dev/quivers"
Documentation = "https://quivers.dev"
Changelog = "https://github.com/quivers-dev/quivers/blob/main/CHANGELOG.md"

[project.entry-points."pygments.lexers"]
qvr = "quivers.dsl.pygments_lexer:QvrLexer"

[project.scripts]
qvr = "quivers.cli:main"
qvr-lsp = "quivers.cli.lsp:_entry"
qvr-kernel = "quivers.kernel.install:_entry"

[tool.hatch.build.targets.wheel]
packages = ["src/quivers"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel.force-include]
"grammars/qvr/src" = "quivers/dsl/_grammar_data/src"
"grammars/qvr/queries/highlights.scm" = "quivers/dsl/_grammar_data/highlights.scm"
"grammars/qvr/vcs/.panproto" = "quivers/cli/migrations/_grammar_vcs/.panproto"

[tool.ruff.lint]
ignore = ["E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Recovery / benchmark tests are gated behind the `slow` marker; the
# default invocation (`pytest tests/`) skips them so the everyday
# turnaround stays under a minute.  Run them explicitly with
# `pytest -m slow tests/` or `pytest --runslow tests/`.
markers = [
    "slow: deselected by default; run with `-m slow` or `--runslow`.",
    "probe: launches a probe container; deselected on the fast tier.",
]
addopts = "-m 'not slow'"

[tool.pyright]
include = ["src/quivers"]
pythonVersion = "3.14"
# torch's __all__ omits most of its public surface, so every torch.*
# access trips reportPrivateImportUsage. This is upstream torch typing
# behaviour, not a quivers concern.
reportPrivateImportUsage = "none"
# didactic's dx.Model field descriptors widen access to the FieldValue
# union (str | int | float | bytes | Decimal | tuple[FieldValue, ...]),
# which pyright cannot narrow back to the declared annotation without
# explicit casts at every call site. The categories below are dominated
# by symptoms of that widening; surface them as warnings so they remain
# visible without failing CI until didactic ships typed field
# descriptors.
reportArgumentType = "warning"
reportOperatorIssue = "warning"
reportGeneralTypeIssues = "warning"
reportIndexIssue = "warning"
reportReturnType = "warning"
reportOptionalIterable = "warning"
reportOptionalSubscript = "warning"
# Fields declared with `dx.field(opaque=True)` are typed at `object` by
# the dx.Model contract — the runtime holds the actual typeclass-instance
# reference by identity but pyright cannot see the methods on it. The
# same widening surfaces as reportCallIssue when those methods are
# invoked. Surface as warnings to stay visible without failing CI.
reportAttributeAccessIssue = "warning"
reportCallIssue = "warning"
reportAssignmentType = "warning"
reportOptionalMemberAccess = "warning"
# pygments_lexer.py shadows class variables on pygments.lexer.Lexer
# (`filenames`, `mimetypes`) and overrides `get_tokens_unprocessed` with
# the tree-sitter-driven tokenizer; both are intentional and match the
# Pygments extension contract.
reportIncompatibleVariableOverride = "warning"
reportIncompatibleMethodOverride = "warning"
reportMissingImports = "warning"
# Per-branch redeclaration of nested helpers (`make_call`, `call`,
# `_axiom_injector`) is intentional: each branch builds a closure
# with branch-specific captures and only one branch is reached at
# runtime.
reportRedeclaration = "warning"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
