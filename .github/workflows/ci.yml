name: CI

# What runs, and where, is declared in `.config/verification.toml`.

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue runs this on the commit that will become `main`.
  merge_group:
  # Daily on `main` with the newest versions of every dependency, which also
  # keeps the caches alive: one nothing has read for seven days is dropped.
  schedule:
    - cron: "30 4 * * *"
  # Runs every gate on a commit, which certifies it for a release.
  workflow_dispatch:

# A new push to a pull request supersedes the run before it. A run on any
# other event is for a commit of its own and always completes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # One thread to a process: the runner's cores are divided between the
  # workers, and the tensors of the suite are too small to share between them.
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  DEPENDENCIES: ${{ github.event_name == 'schedule' && 'newest' || 'locked' }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tests: ${{ steps.plan.outputs.tests }}
      probes: ${{ steps.plan.outputs.probes }}
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
      # The merge commit of a pull request and both of its parents.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Check the declaration
        run: python tools/verification.py check
      - name: Plan the jobs
        id: plan
        run: python tools/verification.py plan

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      # Pinned to the line the tree is clean under. Unpinned, a
      # linter release adds rules and every branch goes red at
      # once, for a change nobody in this repository made.
      - name: Install Ruff
        run: python -m pip install 'ruff>=0.15,<0.16'

      - name: Check lint rules
        run: ruff check src/ tests/ hatch_build.py tools/

      - name: Check formatting
        run: ruff format --check src/ tests/ hatch_build.py tools/

      - name: Audit docstrings
        run: python tools/docstring_audit.py --check src/quivers/qiec

      - name: Recompile VS Code extension from its lockfile
        working-directory: editors/vscode-qvr
        run: npm ci && npm test

      - name: Verify checked-in extension output
        run: git diff --exit-code -- editors/vscode-qvr/out

      - name: Verify editor source and archive parity
        run: python tools/check_editor_release.py --full

      - name: Verify pinned Zed grammar and query compatibility
        run: |
          revision=$(python -c 'import tomllib; print(tomllib.load(open("editors/zed-extension-qvr/extension.toml", "rb"))["grammars"]["qvr"]["rev"])')
          git fetch --no-tags --depth=1 origin "$revision"
          python tools/check_editor_release.py --grammar-pin

      - name: Build Zed language server adapter
        working-directory: editors/zed-extension-qvr
        run: |
          rustup target add wasm32-wasip2
          cargo fmt --check
          cargo build --locked --release --target wasm32-wasip2

  type-check:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-environment
        with:
          extras: dev
          dependencies: ${{ env.DEPENDENCIES }}
      - name: Run Pyright
        run: pyright src/quivers

  # The export policy's documentation rule: every public name renders
  # in the API reference. The site build is strict, so a broken
  # cross-reference fails here too rather than at deploy time.
  build-docs:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The checker imports every public package, so the optional
      # runtime dependencies are installed alongside the docs toolchain.
      - uses: ./.github/actions/setup-environment
        with:
          extras: docs,data,diagnostics,formulas,repl,lsp
          dependencies: ${{ env.DEPENDENCIES }}
      - name: Build site
        run: mkdocs build --strict
      - name: Check API reference coverage
        run: python tools/check_api_reference.py site
      - name: Audit rendered math
        run: python scripts/check_rendered_math.py site

  # Native parser assets are part of the wheel's executable compatibility
  # contract. Exercise the installed artifact on every supported runner with
  # compiler discovery disabled so neither current parsing nor migration can
  # hide a missing bundled library behind a machine-local source build.
  test-wheel:
    name: Test wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
          python-version: "3.14"
          activate-environment: true
          no-project: true
          enable-cache: false
      - name: Enable MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: Build wheel
        run: uv build --wheel
      - name: Install the built wheel
        shell: bash
        env:
          UV_TORCH_BACKEND: cpu
        run: |
          uv pip install \
            "didactic==0.18.2" \
            "panproto==0.77.0" \
            "panproto-grammars-all==0.77.0" \
            dist/*.whl
      - name: Validate current and migration parsers without a compiler
        run: python tools/release_wheel_smoke.py .

  # One job to an entry of the plan: the buckets of ordinary tests and the
  # gates the change affects.
  test:
    name: Test (${{ matrix.job.name }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJson(needs.plan.outputs.tests) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-environment
        with:
          tools: ${{ matrix.job.tools }}
          dependencies: ${{ env.DEPENDENCIES }}
      - name: Run tests
        run: python tools/verification.py run '${{ matrix.job.name }}'
        env:
          # No container runs here.
          QUIVERS_SKIP_DOCKER: "1"
          VERIFICATION_REPORTS: reports-of-this-job
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ matrix.job.slug }}
          path: reports-of-this-job/
          if-no-files-found: ignore
          retention-days: 7

  # The probe gates drive eleven real PPLs in containers.
  probe:
    name: Probe (${{ matrix.job.name }})
    needs: plan
    if: needs.plan.outputs.probes != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJson(needs.plan.outputs.probes) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-environment
        with:
          tools: ${{ matrix.job.tools }}
          dependencies: ${{ env.DEPENDENCIES }}
      - uses: ./.github/actions/probe-image
        with: { image: bugs, images: "${{ matrix.job.images }}" }
      - uses: ./.github/actions/probe-image
        with: { image: edward2, images: "${{ matrix.job.images }}" }
      - uses: ./.github/actions/probe-image
        with: { image: jags, images: "${{ matrix.job.images }}" }
      - uses: ./.github/actions/probe-image
        with: { image: julia, images: "${{ matrix.job.images }}" }
      - uses: ./.github/actions/probe-image
        with: { image: node, images: "${{ matrix.job.images }}" }
      - uses: ./.github/actions/probe-image
        with: { image: numpyro, images: "${{ matrix.job.images }}" }
      - uses: ./.github/actions/probe-image
        with: { image: pymc, images: "${{ matrix.job.images }}" }
      - uses: ./.github/actions/probe-image
        with: { image: pyro, images: "${{ matrix.job.images }}" }
      - uses: ./.github/actions/probe-image
        with: { image: stan, images: "${{ matrix.job.images }}" }

      # A pull request may reuse a measurement `main` made of the same program,
      # points, image, and script. A run that certifies a commit executes every
      # container and reads no measurement; a push to `main` stores its own.
      - name: Restore probe measurements
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/qvr-probe-measurements
          key: qvr-probe-measurements-${{ matrix.job.slug }}-${{ github.sha }}
          restore-keys: |
            qvr-probe-measurements-${{ matrix.job.slug }}-

      # No `-x`: one failure would hide every test behind it, so a run
      # would buy one diagnosis and leave the rest unexercised.
      - name: Run tests
        run: python tools/verification.py run '${{ matrix.job.name }}'
        env:
          QUIVERS_PROBE_IMAGES: ${{ matrix.job.images }}
          QUIVERS_PROBE_CACHE: ~/.cache/qvr-probe-measurements
          QUIVERS_PROBE_CACHE_RECORD: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && '0' || '1' }}
          VERIFICATION_REPORTS: reports-of-this-job

      - name: Save probe measurements
        if: github.ref == 'refs/heads/main' && github.event_name != 'schedule'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/qvr-probe-measurements
          key: qvr-probe-measurements-${{ matrix.job.slug }}-${{ github.sha }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ matrix.job.slug }}
          path: reports-of-this-job/
          if-no-files-found: ignore
          retention-days: 7

  # Every test of the suite ran once, in the job that owns it.
  coverage:
    name: Suite coverage
    needs: [plan, test, probe]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: verification-*
          path: reports-of-this-run
      - name: Check that every test ran
        env:
          JOBS: ${{ needs.plan.outputs.jobs }}
        run: python tools/verification.py coverage reports-of-this-run "$JOBS"

  # One stable check for branch protection to require: it passes only
  # when every job above passed or was deliberately left out.
  ci-status:
    name: CI status
    # A cancelled run ends at once instead of waiting for a runner.
    if: ${{ !cancelled() }}
    needs:
      - plan
      - lint
      - type-check
      - build-docs
      - test-wheel
      - test
      - probe
      - coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify every required job succeeded
        env:
          NEEDS: ${{ toJson(needs) }}
        run: |
          # Only the probes may be left out, when the plan has none.
          jq -e 'to_entries | all(
            .value.result == "success"
            or (.key == "probe" and .value.result == "skipped"))' <<< "$NEEDS" \
            || { jq 'map_values(.result)' <<< "$NEEDS"; exit 1; }

  # Passes only on a commit on which every gate ran on its own merits: the
  # check `require-verified.yml` asks for before anything is published.
  release-verification:
    name: Release verification
    needs: ci-status
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "Every gate passed on $GITHUB_SHA, with every probe executed."
