name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      probe: ${{ steps.filter.outputs.probe }}
    steps:
      - uses: actions/checkout@v4
      - name: Determine whether release probes are required
        id: filter
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: every
          filters: |
            probe:
              - "**"
              - "!*.md"
              - "!**/*.md"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # Pinned to the line the tree is clean under. Unpinned, a
      # linter release adds rules and every branch goes red at
      # once, for a change nobody in this repository made.
      - run: pip install 'ruff>=0.15,<0.16'
      - run: ruff check src/ tests/ hatch_build.py tools/release_wheel_smoke.py tools/check_editor_release.py tools/check_api_reference.py
      - run: ruff format --check src/ tests/ hatch_build.py tools/release_wheel_smoke.py tools/check_editor_release.py tools/check_api_reference.py
      - run: python tools/docstring_audit.py --check src/quivers/qiec
      - name: Recompile VS Code extension from its lockfile
        working-directory: editors/vscode-qvr
        run: npm ci && npm run compile
      - name: Verify checked-in extension output
        run: git diff --exit-code -- editors/vscode-qvr/out
      - name: Verify editor source/archive parity
        run: python tools/check_editor_release.py --full

  # The export policy's documentation rule: every public name renders
  # in the API reference. The site build is strict, so a broken
  # cross-reference fails here too rather than at deploy time.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # The checker imports every public package, so the optional
      # runtime dependencies are installed alongside the docs toolchain.
      - run: pip install -e ".[docs,data,diagnostics,formulas,repl,lsp]"
      - run: mkdocs build --strict
      - run: python tools/check_api_reference.py site

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -e ".[dev]"
      - run: pyright src/quivers

  # Native parser assets are part of the wheel's executable compatibility
  # contract. Exercise the installed artifact on every supported runner with
  # compiler discovery disabled so neither current parsing nor migration can
  # hide a missing bundled library behind a machine-local source build.
  migration-assets:
    name: migration-assets (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Enable MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - run: python -m pip install build
      - run: python -m build --wheel
      - name: Install the built wheel
        shell: bash
        run: |
          python -m pip install --force-reinstall \
            "didactic==0.17.1" \
            "panproto==0.74.4" \
            "panproto-grammars-all==0.74.4" \
            dist/*.whl
      - name: Validate current and migration parsers without a compiler
        run: python tools/release_wheel_smoke.py .

  # Fast tier. Everything that does not launch a probe container, which
  # is most of the suite by count and a small share of its runtime. This
  # is the job a pull request waits on.
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # `tests/transpile/test_external_syntax.py` and the gallery
      # compile sweep check each emitted program against the real
      # parser for its language, and a check that finds no binary
      # reports a gap rather than a pass. Scheme covers the Church
      # runtime's arity shims, JAGS the JAGS and BUGS model files,
      # `stanc` Stan, and Julia both Turing and Gen.
      - run: sudo apt-get update && sudo apt-get install -y chezscheme jags
      - name: Install stanc
        run: |
          curl -fsSL -o "$RUNNER_TEMP/stanc" \
            https://github.com/stan-dev/stanc3/releases/download/v2.39.0/linux-stanc
          sudo install -m 0755 "$RUNNER_TEMP/stanc" /usr/local/bin/stanc
          stanc --version
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.11"
      # The WebPPL target's runtime is written in WebPPL's own subset,
      # and `tests/transpile/test_qiec_host_runtimes.py` and the
      # renderer tests run each generated program through the
      # compiler that defines that subset.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g webppl
      # `test_audit_fix_pymc` imports pymc to check the emission
      # against the library's own API rather than against a
      # transcript of it, so the library has to be here: without
      # it the module fails to import and the whole job errors.
      - run: pip install -e ".[dev,data,diagnostics,formulas,repl,lsp,targets]"
      # No probe container runs here, so the image build is skipped
      # outright rather than paid for and left unused.
      # `--dist loadfile` rather than the default per-test scheduling.
      # Most of this tier is thousands of sub-millisecond text checks,
      # and handing those out individually costs more than running
      # them; whole files are the unit worth distributing.
      - run: python -m pytest tests/ -q -m "not probe" -n auto --dist loadfile
        env:
          QUIVERS_SKIP_DOCKER: "1"

  # Release tier. The probe cells, which drive eleven real PPLs in
  # containers and carry nearly all of the suite's wall clock. Sharded
  # across runners: the shards are independent, so the wall clock is the
  # slowest shard rather than the sum.
  probe:
    needs: changes
    if: >-
      always() &&
      (needs.changes.result != 'success' ||
       needs.changes.outputs.probe == 'true')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # The transpile test modules require their target tools at
      # import (`tests/transpile/_tools.py`), whichever tier collects
      # them, so every tier installs the same set: Chez Scheme for the
      # Church runtime, JAGS for the JAGS and BUGS model files, `stanc`
      # for Stan, Julia for Turing and Gen, and Node with WebPPL for
      # the WebPPL runtime.
      - run: sudo apt-get update && sudo apt-get install -y chezscheme jags
      - name: Install stanc
        run: |
          curl -fsSL -o "$RUNNER_TEMP/stanc" \
            https://github.com/stan-dev/stanc3/releases/download/v2.39.0/linux-stanc
          sudo install -m 0755 "$RUNNER_TEMP/stanc" /usr/local/bin/stanc
          stanc --version
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g webppl
      - run: pip install -e ".[dev,data,diagnostics,formulas,repl,lsp,targets]"
      # The suite refuses to skip on a missing probe image and builds
      # all nine instead. They change only when their Dockerfiles do, so
      # the built images are cached against a hash of that directory and
      # loaded back in one archive: `docker save` over all nine shares
      # the base layers between them rather than storing each whole.
      - name: Restore probe images
        id: probe-images
        uses: actions/cache@v4
        with:
          path: ~/.cache/qvr-probe-images
          key: qvr-probe-images-${{ hashFiles('tests/transpile/docker/**') }}
      - name: Load probe images
        if: steps.probe-images.outputs.cache-hit == 'true'
        run: gunzip -c ~/.cache/qvr-probe-images/images.tar.gz | docker load
      # Pull requests may reuse memoised measurements for turnaround. A push to
      # main is release-certifying, so it deliberately leaves the cache unset
      # and executes every probe container against the merged tree.
      - name: Restore probe measurements for pull requests
        if: github.event_name == 'pull_request'
        uses: actions/cache@v4
        with:
          path: ~/.cache/qvr-probe-measurements
          key: qvr-probe-cache-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: |
            qvr-probe-cache-${{ matrix.shard }}-
      # No `-x`: one failure used to hide every test behind it, so a run
      # bought one diagnosis and left the rest unexercised.
      # Two levels of parallelism, because they solve different
      # problems. `--splits` divides the cells across runners, and
      # `-n auto` keeps each runner's cores busy within its share.
      # xdist's default scheduler hands out work as workers free up, so
      # one slow cell does not stall the others in the same shard.
      - name: Run probe shard
        run: |
          python -m pytest tests/ -q -m probe -n auto \
            --splits 4 --group ${{ matrix.shard }}
        env:
          QUIVERS_PROBE_CACHE: >-
            ${{ github.event_name == 'pull_request' &&
                '~/.cache/qvr-probe-measurements' || '' }}
      - name: Save probe images
        if: always() && steps.probe-images.outputs.cache-hit != 'true'
        run: |
          images=$(docker images --format '{{ .Repository }}:{{ .Tag }}' | grep '^panproto-test-' || true)
          if [ -n "$images" ]; then
            mkdir -p ~/.cache/qvr-probe-images
            # shellcheck disable=SC2086
            docker save $images | gzip -1 > ~/.cache/qvr-probe-images/images.tar.gz
          fi

  # The default addopts deselect `slow`, so the gallery sweep and the
  # recovery benchmarks never run in the tiers above. They gate here
  # instead: an example whose prose or code stops matching the library
  # fails CI rather than rotting unnoticed.
  slow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # The transpile test modules require their target tools at
      # import (`tests/transpile/_tools.py`), whichever tier collects
      # them, so every tier installs the same set: Chez Scheme for the
      # Church runtime, JAGS for the JAGS and BUGS model files, `stanc`
      # for Stan, Julia for Turing and Gen, and Node with WebPPL for
      # the WebPPL runtime.
      - run: sudo apt-get update && sudo apt-get install -y chezscheme jags
      - name: Install stanc
        run: |
          curl -fsSL -o "$RUNNER_TEMP/stanc" \
            https://github.com/stan-dev/stanc3/releases/download/v2.39.0/linux-stanc
          sudo install -m 0755 "$RUNNER_TEMP/stanc" /usr/local/bin/stanc
          stanc --version
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g webppl
      # `test_audit_fix_pymc` imports pymc to check the emission
      # against the library's own API rather than against a
      # transcript of it, so the library has to be here: without
      # it the module fails to import and the whole job errors.
      - run: pip install -e ".[dev,data,diagnostics,formulas,repl,lsp,targets]"
      - run: python -m pytest tests/ -m slow -q
