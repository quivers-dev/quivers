name: Release

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build source distribution
        run: python -m build --sdist

      - name: Upload source distribution
        uses: actions/upload-artifact@v4
        with:
          name: distributions-sdist
          path: dist/*.tar.gz

  build-wheels:
    name: Build wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build platform wheel
        uses: pypa/cibuildwheel@v4.1.0
        env:
          CIBW_BUILD: cp314-*
          CIBW_ARCHS: auto64
          CIBW_SKIP: "*-musllinux_*"
          CIBW_TEST_REQUIRES: >-
            didactic==0.18.2
            panproto==0.77.0
            panproto-grammars-all==0.77.0
          CIBW_TEST_COMMAND: >-
            python "{project}/tools/release_wheel_smoke.py" "{project}"
        with:
          output-dir: wheelhouse

      - name: Upload platform wheel
        uses: actions/upload-artifact@v4
        with:
          name: distributions-wheel-${{ matrix.os }}
          path: wheelhouse/*.whl

  verify-distributions:
    name: Verify distributions
    needs: [build-sdist, build-wheels]
    runs-on: ubuntu-latest

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          pattern: distributions-*
          path: dist/
          merge-multiple: true

      - name: Verify distribution metadata
        run: |
          python -m pip install twine
          python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: verify-distributions
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/quivers

    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Attach distributions and editor extension to GitHub release
    needs: publish-pypi
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    permissions:
      contents: write

    steps:
      - name: Check out release assets
        uses: actions/checkout@v4

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Upload distributions to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            editors/vscode-qvr/vscode-qvr-0.7.0.vsix
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
