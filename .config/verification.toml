# The probe gates run emitted programs in the containers of the target
# languages. `images` names the containers a job loads before its tests; a
# test that needs another one fails.

[[gate]]
name = "probes of Edward2 and PyMC"
marker = "probe"
tests = ["@probe modules"]
parameters = ["edward2", "pymc"]
also = [
    "tests/transpile/test_edward2_half_student_numeric.py",
    "tests/transpile/test_equivalence_sensitivity.py::test_edward2_accumulates_log_terms_without_float32_cancellation",
]
reads = [
    "docs/examples/*",
    "tests/benchmarks/models/*",
    "tests/fixtures/qiec/*",
    "tests/transpile/docker/*",
    "tests/transpile/fixtures/*",
    "tests/transpile/probes/*",
]
images = ["edward2", "pymc"]
tools = "languages"
jobs = 1

[[gate]]
name = "probes of NumPyro and Pyro"
marker = "probe"
tests = ["@probe modules"]
parameters = ["numpyro", "pyro"]
reads = [
    "docs/examples/*",
    "tests/benchmarks/models/*",
    "tests/fixtures/qiec/*",
    "tests/transpile/docker/*",
    "tests/transpile/fixtures/*",
    "tests/transpile/probes/*",
]
images = ["numpyro", "pyro"]
tools = "languages"
jobs = 1

[[gate]]
name = "probes of Turing and Gen"
marker = "probe"
tests = ["@probe modules"]
parameters = ["gen", "turing"]
reads = [
    "docs/examples/*",
    "tests/benchmarks/models/*",
    "tests/fixtures/qiec/*",
    "tests/transpile/docker/*",
    "tests/transpile/fixtures/*",
    "tests/transpile/probes/*",
]
images = ["julia"]
tools = "languages"
jobs = 1

[[gate]]
name = "probes of Stan, BUGS and JAGS"
marker = "probe"
tests = ["@probe modules"]
parameters = ["bugs", "jags", "stan"]
also = [
    "tests/transpile/test_builtin_numeric.py::test_stan_scores_every_builtin_a_named_computation_applies",
    "tests/transpile/test_closed_form_marginals.py",
    "tests/transpile/test_marginalize_numeric.py",
    "tests/transpile/test_marginalize_shared_prior_numeric.py::test_stan_indexes_each_row_s_accumulator_by_the_row",
    "tests/transpile/test_via_index_map_numeric.py",
]
reads = [
    "docs/examples/*",
    "tests/benchmarks/models/*",
    "tests/fixtures/qiec/*",
    "tests/transpile/docker/*",
    "tests/transpile/fixtures/*",
    "tests/transpile/probes/*",
]
images = ["bugs", "jags", "numpyro", "stan"]
tools = "languages"
jobs = 1

# A WebPPL probe computes for up to two minutes, which is also how long a probe
# may take, so this gate leaves each worker a physical core.
[[gate]]
name = "probes of WebPPL, Church and the reference"
marker = "probe"
tests = ["@probe modules"]
reads = [
    "docs/examples/*",
    "tests/benchmarks/models/*",
    "tests/fixtures/qiec/*",
    "tests/transpile/docker/*",
    "tests/transpile/fixtures/*",
    "tests/transpile/probes/*",
]
images = ["node"]
tools = "languages"
workers = 2
jobs = 2

# The tests of one page share state in order, so a page runs whole, on one
# worker. `key` is a pattern whose first group names the page in a test id.

[[sequence]]
tests = "tests/test_doc_blocks.py"
key = '\[([^\]:]+):'

# A change to one of these affects every gate.

[everything]
files = [
    ".config/*",
    ".github/*",
    "conftest.py",
    "grammars/*",
    "hatch_build.py",
    "pyproject.toml",
    "src/quivers/__init__.py",
    "tests/conftest.py",
    "tools/ci_changes.py",
    "tools/import_graph.py",
    "tools/verification.py",
    "tools/verification_plugin.py",
    "uv.lock",
]

# A change to one of these affects only the gates that declare it in `reads`.
# The jobs that always run read them.

[inert]
files = [
    ".gitattributes",
    ".gitignore",
    "CHANGELOG.md",
    "CNAME",
    "CONTRIBUTING.md",
    "LICENSE",
    "README.md",
    "docs/*",
    "editors/*",
    "mkdocs.yml",
    "regression.qvr",
    "reports/*",
    "scripts/*",
    "tests/benchmarks/models/*",
    "tests/data/*",
    "tests/fixtures/*",
    "tests/formulas/oracles/*",
    "tools/check_api_reference.py",
    "tools/check_editor_release.py",
    "tools/docstring_audit.py",
    "tools/griffe_didactic.py",
    "tools/release_wheel_smoke.py",
    "tools/sync_grammar_data.py",
]

# Why a test may be skipped. A skip for any other reason fails the run.

[skips]
reasons = [
    "CUDA",
    "MPS hardware unavailable",
    "could not import 'jax'",
    "could not import 'tensorflow'",
    "got empty parameter set for (example)",
    "the interval does not restrict the unit interval",
    "this law fixes its coordinate convention",
]
