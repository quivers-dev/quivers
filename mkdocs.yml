site_name: Quivers
site_description: Functional probabilistic programming for PyTorch
site_author: Aaron Steven White
site_url: https://quivers.dev/
repo_url: https://github.com/quivers-dev/quivers
repo_name: quivers-dev/quivers
edit_uri: edit/main/docs/
copyright: Quivers is open source under the MIT License.

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/quivers-mark.svg
  favicon: assets/quivers-mark.svg
  language: en
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Use light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.action.edit
    - content.action.view
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/quivers-dev/quivers
      name: Quivers on GitHub

extra_css:
  - css/custom.css

extra_javascript:
  - js/mathjax.js
  - https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.js
  - https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js
  - js/mermaid-init.js
  - js/quivers.js

markdown_extensions:
  - admonition
  - abbr
  - tables
  - md_in_html
  - pymdownx.highlight:
      use_pygments: true
      guess_lang: false
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - attr_list
  - def_list
  - footnotes

hooks:
  - docs/hooks/register_qvr_lexer.py
  - docs/hooks/sync_changelog.py
  - docs/hooks/bibliography.py

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths:
            - src
          inventories:
            - https://docs.pytorch.org/docs/stable/objects.inv
          options:
            extensions:
              - tools/griffe_didactic.py
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            merge_init_into_class: true
            docstring_style: numpy
            docstring_section_style: spacy
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            heading_level: 2

